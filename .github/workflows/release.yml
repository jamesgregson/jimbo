# Publishes jimbo-agent to PyPI and makes a GitHub release when a tag like v0.2.0 is pushed.
# The version is set in pyproject.toml; the tag must match it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches the version in pyproject.toml
        run: |
          version="$(uv version --short)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
      - run: uv sync --locked
      - run: uv run pytest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the VS Code extension into the package, with the package's version
        working-directory: vscode
        run: |
          npm ci
          npm pkg set version="$(uv version --short)"
          npm run bundle
      - run: uv build
      - name: Check the wheel installs and runs, and has the extension
        run: |
          uv run --isolated --no-project --with dist/*.whl jimbo --version
          unzip -l dist/*.whl | grep -q 'jimbo/bundled/jimbo.vsix'
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jimbo-agent/
    permissions:
      id-token: write  # trusted publishing: PyPI accepts this workflow's identity, so no API token is stored
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - name: Create the release with the wheel and sdist
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
