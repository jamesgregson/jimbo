<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jimbo</title>
<style>
  :root {
    color-scheme: light dark;  /* scrollbars and form controls follow the theme */
    --bg: #f7f7f5; --panel: #fff; --fg: #1d1d1b; --dim: #6b6b66; --line: #e2e2dd;
    --user: #e8f0fe; --tool: #f1f5f9; --ok: #1a7f37; --err: #c62828; --warn: #9a6700;
    --add: #e6ffec; --del: #ffebe9; --accent: #3b6fd4; --code: #efefea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #1f1f1c; --fg: #e8e8e3; --dim: #8f8f88; --line: #33332f;
      --user: #1c2a44; --tool: #262623; --ok: #56d364; --err: #ff7b72; --warn: #d29922;
      --add: #12301b; --del: #3d1a1a; --accent: #7aa2f7; --code: #2a2a26;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
           display: flex; gap: 12px; align-items: center; }
  header h1 { font-size: 15px; margin: 0; }
  #stats { font-size: 12px; color: var(--dim); padding: 4px 16px; border-bottom: 1px solid var(--line);
           display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  #stats .meter { width: 90px; height: 6px; border-radius: 3px; background: rgba(128,128,128,.3); overflow: hidden; }
  #stats .meter i { display: block; height: 100%; width: 0; background: var(--accent); }
  #stats .meter.hot i { background: var(--err); }
  #status { font-size: 12px; color: var(--dim); margin-left: auto; }
  #status.busy { color: var(--accent); }
  #sid { font: 12px ui-monospace, Menlo, monospace; color: var(--dim); }
  #sid:hover { color: var(--accent); }
  #status.busy::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 6px;
                         border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
                         vertical-align: -1px; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  #thinking { display: none; padding: 0 16px 6px; color: var(--accent); font-size: 12px; }
  #thinking.show { display: block; }
  #thinking span { display: inline-block; width: 6px; height: 6px; margin-right: 3px; border-radius: 50%;
                   background: currentColor; animation: pulse 1.2s infinite; }
  #thinking span:nth-child(2) { animation-delay: .2s; } #thinking span:nth-child(3) { animation-delay: .4s; }
  #status.off { color: var(--err); }
  #main { flex: 1; min-height: 0; display: flex; }  /* the log and the todo list, between the stats and the input */
  #log { flex: 1; min-width: 0; min-height: 0; overflow-y: auto; padding: 16px; }
  #log > * { max-width: 860px; margin-left: auto; margin-right: auto; }
  .msg { margin: 10px auto; padding: 8px 12px; border-radius: 10px; word-break: break-word; }
  .user { background: var(--user); white-space: pre-wrap; }
  .assistant { background: var(--panel); border: 1px solid var(--line); }
  .assistant p { margin: 0 0 8px; white-space: pre-wrap; } .assistant p:last-child { margin: 0; }
  .assistant h3, .assistant h4, .assistant h5, .assistant h6 { margin: 12px 0 6px; line-height: 1.3; }
  .assistant h3 { font-size: 17px; } .assistant h4 { font-size: 15px; } .assistant h5, .assistant h6 { font-size: 14px; }
  .assistant ul, .assistant ol { margin: 0 0 8px; padding-left: 22px; }
  .assistant li { white-space: pre-wrap; }
  .assistant blockquote { margin: 0 0 8px; padding: 0 12px; border-left: 3px solid var(--line); color: var(--dim); }
  .assistant hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
  .assistant a { color: var(--accent); }
  .assistant table { border-collapse: collapse; margin: 6px 0 8px; display: block; overflow-x: auto; }
  .assistant th, .assistant td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; }
  .assistant th { background: var(--code); }
  code { background: var(--code); padding: 0 4px; border-radius: 4px; font: 12.5px ui-monospace, Menlo, monospace; }
  pre { margin: 6px 0; padding: 8px 10px; background: var(--code); border-radius: 6px; overflow: auto;
        font: 12px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap; max-height: 420px; }
  pre code { background: none; padding: 0; }
  .reasoning { margin: 8px auto; color: var(--dim); font-size: 13px; }
  .reasoning > summary { cursor: pointer; font-size: 12px; }
  .reasoning > div { white-space: pre-wrap; padding: 4px 0 0 12px; border-left: 2px solid var(--line); margin-top: 4px; }
  .reasoning .agent-text { color: var(--fg); margin-top: 6px; }
  .card { margin: 8px auto; border: 1px solid var(--line); background: var(--tool); border-radius: 8px; overflow: hidden; }
  .card > summary { cursor: pointer; padding: 6px 10px; display: flex; gap: 8px; align-items: baseline;
                    font: 12px ui-monospace, Menlo, monospace; list-style: none; }
  .card > summary::-webkit-details-marker { display: none; }
  .card .name { font-weight: 700; }
  .card .sum { color: var(--dim); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .verdict { font-size: 11px; color: var(--dim); white-space: nowrap; }
  .card.denied .verdict { color: var(--err); }
  .card.pending { border-color: var(--warn); }
  .badge { font-size: 11px; padding: 0 6px; border-radius: 8px; border: 1px solid currentColor; }
  .card .sect { padding: 6px 10px; border-top: 1px solid var(--line); }
  .card pre { background: transparent; padding: 0; margin: 0; }
  .ok { color: var(--ok); } .err { color: var(--err); } .dim { color: var(--dim); } .warn { color: var(--warn); }
  .note { font-size: 12px; color: var(--dim); margin: 6px auto; }
  figure.shown { margin: 10px auto; }
  figure.shown img { display: block; max-width: 100%; max-height: 520px; border: 1px solid var(--line);
                     border-radius: 8px; background: #fff; }  /* white behind transparent charts, in dark mode too */
  figure.shown figcaption { font-size: 12px; color: var(--dim); margin-top: 4px; }
  .errbox { border: 1px solid var(--err); color: var(--err); border-radius: 8px; padding: 8px 12px; margin: 10px auto; }
  .warnbox { border: 1px solid var(--warn); color: var(--warn); border-radius: 8px; padding: 8px 12px; margin: 10px auto; }
  .a { background: var(--add); display: block; } .d { background: var(--del); display: block; }
  .cmd { background: var(--tool); border: 1px solid var(--line); font: 12.5px/1.45 ui-monospace, Menlo, monospace;
         white-space: pre-wrap; }
  .cmd .head { color: var(--dim); }
  /* The todo list is a column beside the log, so it never covers the log, its scrollbar or the stats bar. */
  #todos { flex: 0 0 280px; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line);
           padding: 10px 14px; font-size: 12.5px; }
  @media (max-width: 900px) {  /* too narrow for a column: the list goes above the log */
    #main { flex-direction: column; }
    #todos { flex: 0 0 auto; max-height: 30vh; order: -1; border-left: 0; border-bottom: 1px solid var(--line); }
  }
  #todos[hidden] { display: none; }
  #todos h2 { font-size: 12px; margin: 0 0 4px; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
  #todos li { list-style: none; padding: 1px 0; } #todos ul { margin: 0; padding: 0; }
  #todos .done { color: var(--dim); text-decoration: line-through; } #todos .in_progress { font-weight: 600; color: var(--accent); }
  #thumbs { display: flex; gap: 8px; padding: 8px 16px 0; background: var(--panel); flex-wrap: wrap; }
  #thumbs:empty { display: none; }
  .thumb { position: relative; } .thumb img { height: 56px; border-radius: 6px; border: 1px solid var(--line); display: block; }
  .thumb button { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; padding: 0; border-radius: 9px;
                  background: var(--err); font-size: 11px; line-height: 18px; }
  .chip { display: inline-block; font-size: 12px; color: var(--dim); border: 1px solid var(--line); border-radius: 10px;
          padding: 0 8px; margin: 4px 4px 0 0; }
  #hint { padding: 0 16px; background: var(--panel); font: 12px ui-monospace, Menlo, monospace; }
  #hint:empty { display: none; }
  #hint div { padding: 2px 0; } #hint div:first-child { color: var(--accent); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--panel); }
  textarea { flex: 1; resize: none; max-height: 200px; background: var(--bg); color: var(--fg);
             border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 0 18px; font: inherit; cursor: pointer; }
  button.sec { background: var(--bg); color: var(--fg); border: 1px solid var(--line); padding: 6px 14px; }
  button.deny { background: var(--err); }
  button:disabled { opacity: .5; cursor: default; }
  button[hidden], #dlg input[hidden] { display: none; }
  #dlg input { width: 100%; box-sizing: border-box; margin-top: 10px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; }
  #dlg .q { margin: 12px 0; } #dlg .q label { display: block; padding: 3px 0; cursor: pointer; }
  #dlg input[type=radio], #dlg input[type=checkbox] { width: auto; margin: 0 8px 0 0; }
  .msg.user.steer { opacity: .85; border-style: dashed; }
  .risk { margin: 8px 0; padding: 8px 10px; border-left: 4px solid #3a3; background: rgba(128,128,128,.12); }
  .risk.medium { border-color: #cb2; } .risk.high { border-color: #e55; } .risk.critical { border-color: #e55; background: rgba(238,85,85,.2); }
  .risk .why { font-size: 12px; opacity: .7; margin-top: 2px; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; place-items: center; padding: 16px; }
  #modal.show { display: grid; }
  #dlg { background: var(--panel); border-radius: 12px; padding: 16px; width: min(760px, 100%);
         max-height: 90vh; overflow: auto; border: 1px solid var(--warn); }
  #dlg h2 { font-size: 15px; margin: 0 0 4px; } #dlg .sum { margin-bottom: 8px; font-weight: 600; }
  #dlg .btns { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; flex-wrap: wrap; }
  .mode { font-size: 12px; color: var(--dim); display: inline-flex; gap: 6px; align-items: center; }
  .mode select { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
                 padding: 2px 6px; font: inherit; }
  .mode select.risky { border-color: var(--err); color: var(--err); font-weight: 600; }
  #dlg .btns .mode { margin-right: auto; }
  #dlg .plan { max-height: 55vh; overflow: auto; padding: 8px 12px; border-radius: 8px; }
  #st-model { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
              padding: 1px 4px; font: inherit; max-width: 320px; }
  #st-model[hidden] { display: none; }
  #settings { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); z-index: 8; overflow: auto;
              background: var(--panel); border-left: 1px solid var(--line); padding: 12px 16px;
              box-shadow: -8px 0 24px rgba(0,0,0,.15); }
  #settings[hidden] { display: none; }
  #settings .shead { display: flex; gap: 8px; align-items: center; }
  #settings .shead h2 { font-size: 15px; margin: 0; } #settings .shead button { margin-left: auto; }
  #settings .path { font: 11px ui-monospace, Menlo, monospace; color: var(--dim); margin: 2px 0 8px; word-break: break-all; }
  #settings .tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  #settings .tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #settings fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  #settings fieldset:disabled { opacity: .6; }
  #settings h3 { font-size: 12px; margin: 14px 0 6px; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
  #settings .row { display: flex; gap: 6px; align-items: center; margin: 4px 0; flex-wrap: wrap; }
  #settings .row .name { font: 12.5px ui-monospace, Menlo, monospace; min-width: 120px; font-weight: 600; }
  #settings .box { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; margin: 6px 0; }
  #settings input, #settings select { background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 8px; font: 12.5px ui-monospace, Menlo, monospace; flex: 1; min-width: 120px; }
  #settings button { padding: 4px 12px; }
  #settings .msg { font-size: 12px; white-space: pre-wrap; margin-top: 8px; }
  #settings-btn { margin-left: 4px; padding: 4px 12px; }
</style>
</head>
<body>
<header><h1>Jimbo</h1><span id="status" class="off">connecting…</span><a id="sid" target="_blank" title="Open this session's trace" hidden></a><button id="settings-btn" class="sec" type="button" title="Models and providers">Settings</button></header>
<div id="stats"><select id="st-model" title="Model for this session (Settings saves it)" hidden></select><span id="st-status"></span><span id="st-cycle"></span><span id="st-ctx">context —</span><span class="meter" id="st-meter"><i></i></span><span id="st-turn"></span><span id="st-session"></span></div>
<div id="main"><div id="log"></div><aside id="todos" hidden></aside></div>
<div id="thinking"><span></span><span></span><span></span> working…</div>
<div id="hint"></div>
<div id="thumbs"></div>
<form id="form">
  <textarea id="input" rows="1" placeholder="Message jimbo — Enter to send, Shift+Enter for newline" autofocus></textarea>
  <button id="send">Send</button>
  <button id="stop" type="button" class="deny" hidden>Stop</button>
</form>
<div id="modal"><div id="dlg"></div></div>
<aside id="settings" hidden>
  <div class="shead"><h2>Settings</h2><button id="settings-close" class="sec" type="button">Close</button></div>
  <div class="path" id="settings-path"></div>
  <div class="tabs"><button class="sec on" type="button" data-tab="models">Models</button><button class="sec" type="button" data-tab="providers">Providers</button></div>
  <fieldset id="settings-body"></fieldset>
  <div class="msg" id="settings-msg"></div>
</aside>
<datalist id="model-names"></datalist>
<script>
const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const log = $("#log"), input = $("#input"), sendBtn = $("#send"), stopBtn = $("#stop"), statusEl = $("#status");
const token = new URLSearchParams(location.search).get("token") || "";
let ws, running = false, seg = null, segText = "", thinkSeg = null, cards = new Map(), pendingId = null;
let commands = [], lastCtx = null;
const fmtN = (n) => n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n);
const outN = (u) => `${fmtN(u.output_tokens)} out` + (u.thinking_tokens ? ` (${fmtN(u.thinking_tokens)} thinking)` : "");
function showStats(d) {
  const pct = d.window ? Math.round(100 * d.tokens / d.window) : null;
  $("#st-cycle").textContent = d.turns ? `turn ${d.turns} · cycle ${d.turn.requests}/${d.limit}` : "";
  $("#st-cycle").title = "Turns in this session, and model requests (think, then call tools or answer) in this turn, out of its limit";
  $("#st-ctx").textContent = `context ${fmtN(d.tokens)}` + (d.window ? ` / ${fmtN(d.window)} (${pct}%)` : "");
  const m = $("#st-meter"); m.hidden = pct == null; m.classList.toggle("hot", pct != null && pct >= 80);
  m.firstChild.style.width = Math.min(pct || 0, 100) + "%";
  $("#st-turn").textContent = `turn context: ${fmtN(d.turn.input_tokens)} in · ${outN(d.turn)}`;
  $("#st-session").textContent = `session: ${fmtN(d.session.input_tokens)} in · ${outN(d.session)} · ${d.session.requests} req`;
}

function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ""; }
function setRunning(v) {
  running = v; sendBtn.disabled = !ws || ws.readyState !== 1;
  $("#settings-body").disabled = v; $("#st-model").disabled = v;
  stopBtn.hidden = !v; input.placeholder = v ? "Steer jimbo — sent with its next step" : "Message jimbo — Enter to send, Shift+Enter for newline";
  $("#thinking").classList.toggle("show", v);
  if (ws && ws.readyState === 1) setStatus(v ? "working…" : "idle", v ? "busy" : "");
}
// Approval mode: a control in the header and one in each approval prompt, both showing the session's mode.
const MODES = [["default", "Ask first"], ["auto", "Auto"], ["yolo", "YOLO"]];
const MODE_WARNING = "Are you sure? Jimbo will make automated decisions on your behalf and WILL destroy your code, system and reputation";
let approvalMode = "default";
function syncMode(sel) { sel.value = approvalMode; sel.classList.toggle("risky", approvalMode !== "default"); }
function modeControl() {
  const label = el("label", "mode", "Approvals "), sel = el("select");
  label.title = "How later tool calls are approved";
  for (const [value, text] of MODES) { const o = el("option", null, text); o.value = value; sel.append(o); }
  sel.onchange = () => {
    const mode = sel.value;
    syncMode(sel);  // keep showing the session's mode until a status event confirms the change
    if (mode !== "default" && !confirm(MODE_WARNING)) return;
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "approval_mode", mode }));
  };
  label.append(sel); syncMode(sel); return label;
}

// Follow new output while the view is at the bottom. That is decided when the view scrolls, not after content
// arrives: a tall tool card or result would otherwise count as having scrolled away. Following stops only when
// the view moves up, which new content never does, and starts again near the bottom.
let follow = true, lastTop = 0;
log.addEventListener("scroll", () => {
  if (log.scrollHeight - log.scrollTop - log.clientHeight < 120) follow = true;
  else if (log.scrollTop < lastTop) follow = false;
  lastTop = log.scrollTop;
});
function scroll() { if (follow) log.scrollTop = log.scrollHeight; }
// Any change: new rows, tool results filling in a card, streamed text. Images grow the log when they load.
new MutationObserver(scroll).observe(log, { childList: true, subtree: true, characterData: true });
log.addEventListener("load", scroll, true);
function add(node) { endThinking(); log.append(node); scroll(); return node; }
// Reasoning stays open while it streams and folds away once the model moves on.
function endThinking() { if (thinkSeg) { thinkSeg.open = false; thinkSeg = null; } }
// A running agent's thinking and text: one collapsed line per step saying what it is doing, which expands to the text.
const AGENT_PROGRESS = new Set(["assistant_thinking_delta", "assistant_text_delta", "context"]);
let agentStep = null, agentRequests = 0;
function agentLine(s, done) {
  const n = s.chars.toLocaleString();
  s.sum.textContent = `${s.name} › ${done ? `${s.phase === "writing" ? "wrote" : "thought"} ${n} chars` : `${s.phase}… ${n} chars`}`
    + (agentRequests ? ` · request ${agentRequests}` : "");
}
function agentProgress(kind, d) {
  if (kind === "context") { agentRequests = d.turn.requests; if (agentStep) agentLine(agentStep); return; }
  if (!agentStep) {
    const det = add(el("details", "reasoning")), sum = el("summary"), body = el("div");
    det.append(sum, body);
    agentStep = { sum, body, name: d.agent.name, chars: 0, phase: "", part: null };
  }
  const s = agentStep, phase = kind === "assistant_thinking_delta" ? "thinking" : "writing";
  if (phase !== s.phase) { s.phase = phase; s.part = s.body.appendChild(el("div", phase === "writing" ? "agent-text" : null)); }
  s.part.textContent += d.text; s.chars += d.text.length; agentLine(s); scroll();
}
function endAgentStep() { if (agentStep) { agentLine(agentStep, true); agentStep = null; } }

// Small markdown renderer: fences, headings, lists, quotes, tables, rules, and inline code/bold/italic/links.
// Built from DOM nodes only (no innerHTML), and links are limited to http(s)/mailto.
function inline(target, text) {
  const re = /`([^`\n]+)`|\*\*([^*\n]+)\*\*|(?<![\w*])\*([^*\s][^*\n]*?)\*(?![\w*])|\[([^\]\n]+)\]\(([^)\s]+)\)/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) target.append(text.slice(last, m.index));
    if (m[1] != null) target.append(el("code", null, m[1]));
    else if (m[2] != null) { const b = el("strong"); inline(b, m[2]); target.append(b); }
    else if (m[3] != null) { const i = el("em"); inline(i, m[3]); target.append(i); }
    else if (/^(https?:|mailto:)/i.test(m[5])) {
      const a = el("a"); a.href = m[5]; a.target = "_blank"; a.rel = "noopener noreferrer"; inline(a, m[4]); target.append(a);
    } else target.append(m[0]);
    last = re.lastIndex;
  }
  if (last < text.length) target.append(text.slice(last));
}

function renderBlocks(target, text) {
  const lines = text.split("\n"), isBlank = (l) => !l.trim();
  const row = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
  const special = (l) => /^(#{1,6}\s|>|\s*([-*+]|\d+[.)])\s|\s*([-*_]\s*){3,}$)/.test(l);
  let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (isBlank(l)) { i++; continue; }
    let m;
    if ((m = /^#{1,6}(?=\s)/.exec(l))) {
      const h = el("h" + Math.min(m[0].length + 2, 6)); inline(h, l.replace(/^#+\s+/, "").replace(/\s+#+\s*$/, "")); target.append(h); i++;
    } else if (/^\s*([-*_]\s*){3,}$/.test(l)) { target.append(el("hr")); i++; }
    else if (l.startsWith(">")) {
      const q = []; while (i < lines.length && lines[i].startsWith(">")) q.push(lines[i++].replace(/^>\s?/, ""));
      const bq = el("blockquote"); renderBlocks(bq, q.join("\n")); target.append(bq);
    } else if ((m = /^(\s*)([-*+]|\d+[.)])\s+/.exec(l))) {
      const ol = /\d/.test(m[2]), list = el(ol ? "ol" : "ul"), start = parseInt(m[2], 10);
      if (ol && start !== 1) list.start = start;
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) {
        const li = el("li"), body = [lines[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, "")];
        while (i < lines.length && /^\s+\S/.test(lines[i]) && !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) body.push(lines[i++].trim());
        inline(li, body.join("\n")); list.append(li);
      }
      target.append(list);
    } else if (l.includes("|") && i + 1 < lines.length && /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(lines[i + 1]) && lines[i + 1].includes("-")) {
      const table = el("table"), thead = el("thead"), tr = el("tr");
      row(l).forEach((c) => { const th = el("th"); inline(th, c); tr.append(th); });
      thead.append(tr); table.append(thead); i += 2;
      const tbody = el("tbody");
      while (i < lines.length && !isBlank(lines[i]) && lines[i].includes("|")) {
        const r = el("tr"); row(lines[i++]).forEach((c) => { const td = el("td"); inline(td, c); r.append(td); }); tbody.append(r);

      const p = el("p"); inline(p, para.join("\n")); target.append(p);
    }
  }
}

function onEvent(ev) {

  switch (ev.kind) {

    case "tool_call": {

    }

    case "image": {  // show_image: the server kept the file as it was when shown

    }
    case "context": lastCtx = d; showStats(d); break;
    case "status":
      currentModel = d.model; renderModelPicker();
      $("#st-status").textContent = [d.mode === "plan" && "PLAN", d.yolo && "YOLO", d.auto && "AUTO", (d.sandbox === "docker" || d.sandbox === "podman") && `${d.sandbox} sandbox`, !d.sandboxed && "not sandboxed"].filter(Boolean).join(" · ");

// An approval decision belongs to its tool call, whose card may not be the last one when calls run together.
function showVerdict(d) {
  const by = d.decided_by === "user" ? "you" : d.decided_by, text = `${d.action === "allow" ? "allowed" : "denied"} by ${by}`;
  const risk = d.assessment ? `risk ${d.assessment.risk}: ${d.assessment.summary}` : null;
  const det = cards.get(d.call_id);
  if (!det) {  // a log from before calls had ids
    add(el("div", "note", `${d.tool}: ${text}` + (risk ? ` · ${risk}` : "")));
    if (d.detail) add(diff(d.detail));
    return;
  }
  det.classList.remove("pending");
  det._verdict.textContent = text;
  det._badge.className = "badge dim"; det._badge.textContent = "running";
  if (d.action !== "allow") { det.classList.add("denied"); det.open = true; }
  if (risk) det.append(sect(el("div", "note", risk)));
  if (d.detail) { det.append(sect(diff(d.detail))); det.open = true; }  // no prompt showed this diff
}

function showApproval(req) {
  pendingId = req.id;
  const card = cards.get(req.call_id);
  if (card) {
    card.classList.add("pending"); card.scrollIntoView({ block: "nearest" });
    card._badge.className = "badge warn"; card._badge.textContent = "needs approval";
  }
  const dlg = $("#dlg"); dlg.replaceChildren(el("h2", null, req.title), el("div", "sum", req.summary));
  const a = req.assessment;
  if (a) {
    const box = el("div", "risk " + a.risk);
    box.append(el("b", null, a.risk.toUpperCase()), " " + a.summary);
    if (a.reasons.length) box.append(el("div", "why", a.reasons.join("; ")));
    box.append(el("div", "why", a.model ? "assessed by " + a.model : "fixed checks only; no model assessment"));
    dlg.append(box);
  }
  if (req.detail && req.markdown) { const md = el("div", "assistant plan"); renderMd(md, req.detail); dlg.append(md); }
  else if (req.detail) dlg.append(diff(req.detail));
  const btns = el("div", "btns"), answer = (decision, note) => ws.send(JSON.stringify({ type: "approve", id: req.id, decision, note }));
  btns.append(modeControl());
  const why = el("input"); why.type = "text"; why.placeholder = `${req.note_prompt} (optional) — Enter to send`; why.hidden = true;
  why.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); answer("no", why.value); } };
  const choices = [[req.deny_label, "no", "deny"], [req.allow_label, "yes", req.always ? "sec" : ""]];
  if (req.always) choices.push([`Always (${req.always})`, "always", ""]);
  for (const [label, decision, cls] of choices) {
    const b = el("button", cls, label); b.type = "button";
    b.onclick = () => {
      if (decision !== "no") return answer(decision);
      if (why.hidden) { why.hidden = false; why.focus(); } else answer("no", why.value);
    };
    btns.append(b);
  }
  dlg.append(why, btns); $("#modal").classList.add("show"); btns.lastChild.focus();
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws?token=${encodeURIComponent(token)}`);
  ws.onopen = () => { log.replaceChildren(); follow = true; cards.clear(); seg = null; agentStep = null; agentRequests = 0; modelLists = {}; setRunning(false); };  // history is replayed
  ws.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.type === "event") onEvent(msg.event);
    else if (msg.type === "files") { if (msg.prefix === atToken()) { fileHits = msg.files; updateHint(); } }
    else if (msg.type === "approval") showApproval(msg.request);
    else if (msg.type === "approval_closed" && msg.id === pendingId) { $("#modal").classList.remove("show"); pendingId = null; }
    else if (msg.type === "secret") showSecret(msg);
    else if (msg.type === "confirm") showConfirm(msg);
    else if (msg.type === "confirm_closed" && msg.id === pendingId) { $("#modal").classList.remove("show"); pendingId = null; }
    else if (msg.type === "secret_closed" && msg.id === pendingId) { $("#modal").classList.remove("show"); pendingId = null; }
    else if (msg.type === "questions") showQuestions(msg);
    else if (msg.type === "questions_closed" && msg.id === pendingId) { $("#modal").classList.remove("show"); pendingId = null; }
    else if (msg.type === "models") { modelLists[msg.provider] = msg.models || { error: msg.error }; renderModelPicker(); fillModelNames(lastSpecInput); }
  };
  ws.onclose = () => { setStatus("disconnected — retrying…", "off"); sendBtn.disabled = true; setTimeout(connect, 1500); };
}

const MAX_IMAGES = 4, MAX_IMAGE_BYTES = 5000000, IMAGE_TYPES = ["image/png", "image/jpeg", "image/gif", "image/webp"];
let images = [];  // {media_type, data (base64), url (object URL for the thumbnail)}
function renderThumbs() {
  $("#thumbs").replaceChildren(...images.map((im, i) => {
    const d = el("div", "thumb"), x = el("button", null, "×"); x.type = "button";
    x.onclick = () => { URL.revokeObjectURL(im.url); images.splice(i, 1); renderThumbs(); };
    const img = el("img"); img.src = im.url; d.append(img, x); return d;
  }));
}
function addImage(file) {
  if (!IMAGE_TYPES.includes(file.type)) return add(el("div", "note warn", `unsupported image type ${file.type || "?"}`));
  if (file.size > MAX_IMAGE_BYTES) return add(el("div", "note warn", `image is ${Math.round(file.size / 1000)} KB; the limit is ${MAX_IMAGE_BYTES / 1000} KB`));
  if (images.length >= MAX_IMAGES) return add(el("div", "note warn", `at most ${MAX_IMAGES} images per message`));
  const r = new FileReader();
  r.onload = () => { images.push({ media_type: file.type, data: String(r.result).split(",")[1], url: URL.createObjectURL(file) }); renderThumbs(); };
  r.readAsDataURL(file);
}
function takeImages(dt) {
  const files = [...(dt.files || [])].filter((f) => f.type.startsWith("image/"));
  files.forEach(addImage); return files.length > 0;
}
input.onpaste = (e) => { if (takeImages(e.clipboardData)) e.preventDefault(); };  // plain text pastes natively, newlines kept
input.ondragover = (e) => e.preventDefault();
input.ondrop = (e) => { if (takeImages(e.dataTransfer)) e.preventDefault(); };
function submit() {
  const text = input.value.trim();
  if ((!text && !images.length) || !ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ type: "send", text, images: images.map(({ media_type, data }) => ({ media_type, data })) }));
  images.forEach((im) => URL.revokeObjectURL(im.url)); images = []; renderThumbs();
  input.value = ""; input.style.height = "auto";
}
function matches() {
  const t = input.value;
  return t.startsWith("/") && !/\s/.test(t) ? commands.filter((c) => c.name.startsWith(t.slice(1))) : [];
}
let fileHits = [], lastAt = null;
const atToken = () => { const m = /(?<![\w@])@([^\s@]*)$/.exec(input.value.slice(0, input.selectionStart)); return m ? m[1] : null; };
function acceptFile(path) {
  const pos = input.selectionStart, before = input.value.slice(0, pos).replace(/@[^\s@]*$/, "@" + path + " ");
  input.value = before + input.value.slice(pos); input.selectionStart = input.selectionEnd = before.length;
  fileHits = []; lastAt = null; updateHint(); input.focus();
}
function updateHint() {
  const at = atToken();

  lastAt = at;
  const rows = fileHits.slice(0, 8).map((f) => { const d = el("div", null, "@" + f); d.onmousedown = (e) => { e.preventDefault(); acceptFile(f); }; return d; });
  $("#hint").replaceChildren(...(rows.length ? rows : matches().map((c) => el("div", null, `/${c.name} — ${c.help}`))));
}
$("#form").onsubmit = (e) => {
  e.preventDefault();
  submit();
};
stopBtn.onclick = () => ws.send(JSON.stringify({ type: "cancel" }));
input.onkeydown = (e) => {
  if (e.key === "Tab" && fileHits.length && atToken() !== null) { e.preventDefault(); acceptFile(fileHits[0]); }
  else if (e.key === "Tab" && matches().length) { e.preventDefault(); input.value = "/" + matches()[0].name + " "; updateHint(); }
  else if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); updateHint(); }

input.oninput = () => {
  input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 200) + "px"; updateHint();
};
$("header h1").after(modeControl());

// A key typed here goes to jimbo only: it is not shown, logged or replayed.

// The model's questions. Typing in the box below them stops the round and sends that text instead.
function showQuestions(msg) {
  pendingId = msg.id;
  const dlg = $("#dlg"), picked = msg.questions.map((q) => q.multiple ? [] : null), btns = el("div", "btns");
  const other = el("input"); other.type = "text"; other.placeholder = "Or tell jimbo something else instead (stops these questions)";
  const ok = el("button", null, "Answer"); ok.type = "button";
  const update = () => {
    const stop = other.value.trim() !== "";
    ok.textContent = stop ? "Stop and send" : "Answer"; ok.disabled = !stop && picked.includes(null);
  };
  const send = () => {
    if (ok.disabled) return;
    const feedback = other.value.trim();
    ws.send(JSON.stringify({ type: "answers", id: msg.id, answers: picked, ...(feedback ? { feedback } : {}) }));
  };
  dlg.replaceChildren(el("h2", null, msg.questions.length > 1 ? `${msg.questions.length} questions` : "Question"));
  msg.questions.forEach((q, i) => {
    const box = el("div", "q"); box.append(el("div", "sum", `${i + 1}. ${q.question}`));
    if (q.multiple) box.append(el("div", "note", "Pick any number"));
    for (const option of q.kind === "yes_no" ? ["yes", "no"] : q.options) {
      const label = el("label"), mark = el("input"); mark.type = q.multiple ? "checkbox" : "radio"; mark.name = `${msg.id}-${i}`;
      mark.onchange = () => {
        if (!q.multiple) picked[i] = option;
        else picked[i] = q.options.filter((o, n) => box.querySelectorAll("input")[n].checked);
        update();
      };
      label.append(mark, option); box.append(label);
    }
    dlg.append(box);
  });
  other.oninput = update;
  other.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); send(); } };
  ok.onclick = send; btns.append(ok); update();
  dlg.append(other, btns); $("#modal").classList.add("show");
}

// ---- Models and providers. Changes in the settings panel are saved to the user config. ----
let cfg = null, currentModel = null, modelLists = {}, settingsTab = "models", lastSpecInput = null;
const configSet = (msg) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "config_set", ...msg })); };
const providerOf = (spec) => spec && spec.includes(":") ? spec.split(":")[0] : null;
function requestModels(provider) {
  if (!provider || provider in modelLists || !ws || ws.readyState !== 1) return;
  modelLists[provider] = null; ws.send(JSON.stringify({ type: "models_list", provider }));
}
function option(value, text) { const o = el("option", null, text); o.value = value; return o; }
function button(text, onclick, cls = "sec") { const b = el("button", cls, text); b.type = "button"; b.onclick = onclick; return b; }
function textField(value, placeholder, type = "text") {
  const f = el("input"); f.type = type; f.value = value || ""; f.placeholder = placeholder; f.autocomplete = "off"; return f;
}
// A field for "<provider>:<name>": suggests providers, then the chosen provider's models.
function specField(value) {
  const f = textField(value, "provider:model"); f.setAttribute("list", "model-names");
  f.onfocus = f.oninput = () => { lastSpecInput = f; requestModels(providerOf(f.value)); fillModelNames(f); };
  return f;
}
function fillModelNames(f) {
  if (!f || !cfg) return;
  const p = providerOf(f.value), list = p && modelLists[p];
  const names = Array.isArray(list) ? list.map((m) => `${p}:${m}`) : cfg.providers.map((x) => x.name + ":");
  $("#model-names").replaceChildren(...names.slice(0, 500).map((n) => option(n, n)));
}

function renderModelPicker() {
  const sel = $("#st-model");
  if (!currentModel) return;
  const opts = [option(currentModel, currentModel)], seen = new Set([currentModel]);
  for (const [name, spec] of Object.entries(cfg ? cfg.aliases : {}))
    if (name !== "main" && !seen.has(name)) { seen.add(name); opts.push(option(name, `${name} — ${spec}`)); }
  const p = providerOf(currentModel), list = modelLists[p];
  if (Array.isArray(list)) for (const m of list) { const s = `${p}:${m}`; if (!seen.has(s)) { seen.add(s); opts.push(option(s, s)); } }
  sel.replaceChildren(...opts); sel.value = currentModel; sel.hidden = false;
}
$("#st-model").onfocus = () => requestModels(providerOf(currentModel));
$("#st-model").onchange = (e) => { configSet({ op: "main", value: e.target.value }); e.target.value = currentModel; };

function renderSettings() {
  if (!cfg) return;
  $("#settings-path").textContent = `Saved to ${cfg.path}`;
  document.querySelectorAll("#settings .tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === settingsTab));
  $("#settings-body").replaceChildren(...(settingsTab === "models" ? modelsTab() : providersTab()));
}

function modelsTab() {
  const out = [el("h3", null, "Aliases")];
  for (const [name, spec] of Object.entries(cfg.aliases)) {
    const row = el("div", "row"), f = specField(spec);
    row.append(el("span", "name", name), f, button("Save", () => configSet(name === "main" ? { op: "main", value: f.value, save: true }
      : { op: "alias_set", name, spec: f.value })));
    if (name !== "main") row.append(button("Remove", () => configSet({ op: "alias_rm", name })));
    out.push(row);
  }
  const add = el("div", "row"), name = textField("", "new alias"), spec = specField("");
  add.append(name, spec, button("Add", () => configSet({ op: "alias_set", name: name.value, spec: spec.value })));
  out.push(add, el("h3", null, "Tasks and agents"));
  for (const t of cfg.tasks) {
    if (t.task === "main") continue;
    const row = el("div", "row"), sel = el("select");
    sel.append(option("", `default (main)`));
    for (const name of Object.keys(cfg.aliases)) sel.append(option(name, name));
    if (t.value && !(t.value in cfg.aliases)) sel.append(option(t.value, t.value));
    sel.value = t.value || "";
    sel.onchange = () => configSet({ op: "task_set", task: t.task, value: sel.value || null });
    const where = t.source === "config" || t.source === "main" ? t.spec : `${t.spec} (${t.source})`;
    row.append(el("span", "name", (t.agent ? "@" : "") + t.task), sel, el("span", "dim", where));
    out.push(row);
  }
  return out;
}

function keyRequest(name, value) {
  const v = value.trim();
  return v.startsWith("$") ? { op: "provider_set", name, key_env: v } : { op: "provider_set", name, key: v };
}
function providersTab() {
  const out = [];
  for (const p of cfg.providers) {
    const box = el("div", "box"), head = el("div", "row");
    head.append(el("span", "name", p.name), el("span", "dim", [p.builtin && "built in", p.changed && "changed"].filter(Boolean).join(", ")));
    head.append(button("Test", () => configSet({ op: "provider_test", name: p.name })));
    if (p.changed) head.append(button(p.builtin ? "Reset" : "Remove", () => {
      if (confirm(p.builtin ? `Remove your settings for ${p.name}?` : `Remove provider ${p.name}?`)) configSet({ op: "provider_rm", name: p.name });
    }));
    const url = el("div", "row"), u = textField(p.base_url, "default URL");
    url.append(el("span", "dim", "URL"), u, button("Save", () => configSet({ op: "provider_set", name: p.name, base_url: u.value })));
    const key = el("div", "row"), k = textField("", `key: ${p.key}`, "password");
    k.title = "Paste a key, or type $NAME to read it from an environment variable";
    key.append(el("span", "dim", "Key"), k, button("Save", () => { if (k.value.trim()) configSet(keyRequest(p.name, k.value)); }));
    box.append(head, url, key); out.push(box);
  }
  const add = el("div", "box"), r1 = el("div", "row"), r2 = el("div", "row");
  const name = textField("", "name"), url = textField("", "http://host:port/v1"), key = textField("", "key or $ENV_VAR (optional)", "password");
  r1.append(name, url); r2.append(key, button("Add provider", () => {
    const msg = { op: "provider_set", new: true, name: name.value, base_url: url.value };
    if (key.value.trim()) Object.assign(msg, keyRequest(name.value, key.value));
    configSet(msg);
  }, ""));
  add.append(el("h3", null, "Add a provider"), r1, r2); out.push(add);
  return out;
}

$("#settings-btn").onclick = () => {
  $("#settings").hidden = !$("#settings").hidden;
  if (!$("#settings").hidden && ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "config_get" }));
};
$("#settings-close").onclick = () => { $("#settings").hidden = true; };
document.querySelectorAll("#settings .tabs button").forEach((b) => { b.onclick = () => { settingsTab = b.dataset.tab; renderSettings(); }; });
connect();
</script>
</body>
</html>
