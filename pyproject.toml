[project]
name = "jimbo-agent"  # "jimbo" on PyPI is another project; the import name and command stay jimbo
version = "0.2.0"
description = "A simple coding agent built on Pydantic AI"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai-slim[openai,web-fetch]",
    "pydantic-settings",
    "rich",
    "prompt_toolkit",
    "aiohttp>=3.14.5",
    "pyyaml>=6.0.3",
    "tomlkit>=0.15.2",
    "basedpyright>=1.40.2",
]

[project.urls]
Homepage = "https://github.com/jamesgregson/jimbo"
Issues = "https://github.com/jamesgregson/jimbo/issues"

[project.scripts]
jimbo = "jimbo.main:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["src/jimbo/bundled/jimbo.vsix"]  # git ignores it, so hatch needs telling; `npm run bundle` in vscode/

[tool.hatch.build.targets.sdist]
# hatch reads only the root .gitignore, so vscode/.gitignore's build outputs are repeated here
exclude = ["vscode/node_modules", "vscode/.vscode-test", "vscode/out", "vscode/dist", "vscode/*.vsix",
           "vscode/media/index.html", "vscode/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/jimbo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]  # not evals/: its fixtures hold tests that fail on purpose
pythonpath = ["."]  # so tests can import evals
