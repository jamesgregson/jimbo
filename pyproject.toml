[project]
name = "jimbo"
version = "0.1.0"
description = "A simple coding agent built on Pydantic AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai-slim[openai]",
    "pydantic-settings",
    "rich",
    "prompt_toolkit",
    "aiohttp>=3.14.5",
    "pyyaml>=6.0.3",
    "tomlkit>=0.15.2",
]

[project.scripts]
jimbo = "jimbo.main:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jimbo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
